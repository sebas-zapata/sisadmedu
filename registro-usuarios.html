<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./img/Logo SISADMEDU.jpg" type="image/x-icon">
    <link rel="stylesheet" href="./css/estilos-formularios.css">
    <title>Formulario de Registro - SISADMEDU</title>
</head>

<body>
    <div class="form-container">
        <div class="logo">
            <img src="./img/Logo SISADMEDU.jpg" alt="Logo del Sistema">
        </div>
        <h2>Registro de usuarios</h2>
        <form id="registroForm" action="/register" method="POST" autocomplete="off">
            <input type="text" id="documento" name="documento" placeholder="Numero de documento">
            <span class="error" id="docError"></span>
            <input type="text" id="nombre" name="nombre" placeholder="Nombres">
            <span class="error" id="nombreError"></span>
            <input type="text" id="apellidos" name="apellidos" placeholder="Apellidos">
            <span class="error" id="apellidosError"></span>
            <input type="email" id="email" name="email" placeholder="Correo electrónico">
            <span class="error" id="emailError"></span>
            <input type="tel" id="telefono" name="telefono" placeholder="Número de teléfono">
            <span class="error" id="telefonoError"></span>
            <input type="password" id="password" name="password" placeholder="Contraseña">
            <span class="error" id="passwordError"></span>
            <select id="rol" name="rol">
                <option value="">Selecciona tu rol</option>
                <option value="estudiante">Estudiante</option>
                <option value="estudiante">Acudiente</option>
            </select>
            <span class="error" id="rolError"></span>
            <input type="submit" value="Registrarse">
        </form>
    </div>
    <script src="./js/validar-registro-usuarios.js"></script>
</body>

</html>
