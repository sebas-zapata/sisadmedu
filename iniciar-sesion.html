<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./img/Logo SISADMEDU.jpg" type="image/x-icon">
    <link rel="stylesheet" href="./bootstrap-5.3.3-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/estilos-formularios.css">
    <title>Inicio de Sesion - SISADMEDU</title>
</head>

<body>
    <div class="form-container">
        <div class="logo">
            <img src="./img/Logo SISADMEDU.jpg" alt="Logo del Sistema">
        </div>
        <h2>Inicio de Sesión</h2>
        <form id="loginForm" action="/login" method="POST" autocomplete="off">
            <input type="email" id="email-login" name="email" placeholder="Correo electrónico">
            <span class="error" id="emailLoginError"></span>
            <input type="password" id="password-login" name="password" placeholder="Ingresa tu contraseña">
            <span class="error" id="passwordLoginError"></span>
            <input type="submit" value="Iniciar Sesión">
        </form>
    </div>
    <script src="./js/validar-inicio-sesion.js"></script>
    <script src="./bootstrap-5.3.3-dist/js/bootstrap.min.js"></script>
</body>

</html>
