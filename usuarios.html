<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./bootstrap-5.3.3-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/estilos.css">
    <title>Listado de Usuarios y Roles</title>
</head>

<body>

    <header>
        <h1>Gestión de Usuarios</h1>
        <p>Visualización de los datos de usuarios y sus roles asociados.</p>
    </header>

    <main>
        <section>
            <h2 class="titulo-gestion-usuarios">Tabla de Usuarios</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID Usuario</th>
                        <th>Documento</th>
                        <th>Nombres</th>
                        <th>Apellidos</th>
                        <th>Correo Electrónico</th>
                        <th>Teléfono</th>
                        <th>Contraseña</th>
                        <th>Rol</th>
                        <th>Editar</th>
                        <th>Eliminar</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Ejemplo de una fila con espacios para datos de la base de datos -->
                    <tr>
                        <td data-label="ID Usuario"></td>
                        <td data-label="Documento"></td>
                        <td data-label="Nombres"><!-- nombres_usuario --></td>
                        <td data-label="Apellidos"><!-- apellidos_usuario --></td>
                        <td data-label="Correo Electrónico"><!-- correo_electronico_usuario --></td>
                        <td data-label="Teléfono"><!-- telefono_usuario --></td>
                        <td data-label="Contraseña"><!-- contraseña_usuario --></td>
                        <td data-label="Rol"><!-- rol (nombre del rol) --></td>
                        <td data-label="Editar">
                            <a href="" class="btn btn-edit">Editar</a>
                        </td>
                        <td data-label="Eliminar">
                            <a href="" class="btn btn-delete">Eliminar</a>
                        </td>
                    </tr>
                    <!-- Agregar más filas de usuarios según los datos de la base de datos -->
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Gestión de Usuarios y Roles</p>
    </footer>
    <script src="./bootstrap-5.3.3-dist/js/bootstrap.min.js"></script>
</body>

</html>
